plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Baritone публикуется только в релизах GitHub, не в Maven: берём API-jar оттуда как
	// ivy-артефакт. Нужен лишь для компиляции BaritoneBridge — в jar мода не попадает,
	// игрок ставит Baritone отдельно (LGPL-3.0), без него автопилот работает без добычи.
	ivy {
		name = "BaritoneReleases"
		url = "https://github.com/cabaletta/baritone/releases/download"
		patternLayout {
			artifact "v[revision]/[module]-[revision].[ext]"
		}
		metadataSources { artifact() }
		content { includeGroup "cabaletta" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation "com.google.code.gson:gson:2.10.1"

	// Необязательная зависимость: только компиляция, проверка контрольной суммы — в verification-metadata нет,
	// поэтому сверяем SHA-1 вручную задачей verifyBaritoneApi.
	modCompileOnly "cabaletta:baritone-api-fabric:${project.baritone_version}"
}

// SHA-1 из checksums.txt релиза v1.10.1 — защита от подмены артефакта в релизе.
def baritoneSha1 = "0f04d68a4ea47246b122370e10e8ad661437aa62"
tasks.register("verifyBaritoneApi") {
	doLast {
		def jar = configurations.modCompileOnly.resolve().find { it.name.startsWith("baritone-api-fabric") }
		if (jar == null) {
			throw new GradleException("baritone-api-fabric не найден среди зависимостей")
		}
		def actual = jar.bytes.digest("SHA-1")
		if (actual != baritoneSha1) {
			throw new GradleException("Контрольная сумма Baritone не совпала: ${actual}")
		}
	}
}
tasks.named("compileClientJava") { dependsOn "verifyBaritoneApi" }

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}