<!DOCTYPE html>
<html>
<head>
    <title>Состояние игрока — AI Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .state-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .state-card { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 20px; }
        .state-card h3 { margin-top: 0; color: #bb86fc; }
        .meta { color: #aaa; font-size: 14px; margin-bottom: 15px; }
        .pill-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .pill { background: rgba(98,0,234,0.25); border: 1px solid rgba(187,134,252,0.35); border-radius: 999px; padding: 6px 10px; font-size: 13px; }
        .kv-list { display: grid; gap: 8px; }
        .kv-item { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; background: rgba(255,255,255,0.04); border-radius: 6px; }
        .empty { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/admin">Логи</a>
            <a href="/admin/responses">Ответы LLM</a>
            <a href="/admin/wiki">Справочник</a>
            <a href="/admin/analytics">Аналитика</a>
            <a href="/admin/player-state" class="active">Состояние игрока</a>
            <a href="/admin/challenges">Челленджи</a>
            <a href="/admin/settings">Настройки</a>
            <a href="/chat">Игровой чат</a>
            <a href="/compare">Сравнение</a>
        </nav>

        <div class="analytics-container">
            <h2>Состояние игрока</h2>
            <p>Текущее агрегированное состояние игрока: инвентарь, убийства и последние телеметрические обновления.</p>
            <div class="filters">
                <button onclick="loadPlayerState()">Обновить</button>
            </div>
            <div id="updatedAt" class="meta"></div>
            <div class="state-grid">
                <div class="state-card">
                    <h3>Убийства</h3>
                    <div id="killSummary" class="meta"></div>
                    <div id="killCounts" class="kv-list"></div>
                    <h3>Последние убийства</h3>
                    <div id="recentKills" class="kv-list"></div>
                </div>
                <div class="state-card">
                    <h3>Сводка по инвентарю</h3>
                    <div id="inventoryCounts" class="kv-list"></div>
                    <h3>Хотбар</h3>
                    <div id="hotbar" class="pill-list"></div>
                    <h3>Броня</h3>
                    <div id="armor" class="pill-list"></div>
                    <h3>Левая рука</h3>
                    <div id="offhand" class="pill-list"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="/frontend/js/player_state.js"></script>
</body>
</html>
